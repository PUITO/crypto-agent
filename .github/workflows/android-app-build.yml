name: Build Android App APK

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper
        working-directory: android
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "wrapper jar missing, generating..."
            gradle wrapper --gradle-version 8.7
          fi
          ls -la gradle/wrapper/ || true

      - name: Bump versionCode
        id: ver
        working-directory: android
        run: |
          CODE="${{ github.run_number }}"
          NAME="0.2.${CODE}"
          SHA="${GITHUB_SHA:0:7}"
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          sed -i "s/versionCode = [0-9]*/versionCode = $CODE/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"$NAME\"/" app/build.gradle.kts
          grep -E "versionCode|versionName|applicationId" app/build.gradle.kts

      - name: Build debug APK
        working-directory: android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
          mkdir -p dist
          SRC=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then
            echo "APK not found"
            find app/build -type f | head -50
            exit 1
          fi
          cp "$SRC" "dist/app-debug.apk"
          cp "$SRC" "dist/crypto-agent-app-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.sha }}.apk"
          ls -lah dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-agent-app-${{ steps.ver.outputs.name }}
          path: android/dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Recreate android-app-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-app-latest --repo "${{ github.repository }}" --yes 2>/dev/null || true
          git push origin :refs/tags/android-app-latest 2>/dev/null || true
          sleep 2

      - name: Publish APK Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app-latest
          name: "Android App ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.sha }})"
          prerelease: true
          body: |
            ## Crypto-Agent Android（分支 `android-app`）
            - versionName: `${{ steps.ver.outputs.name }}`
            - versionCode: `${{ steps.ver.outputs.code }}`
            - commit: `${{ github.sha }}`
            - 包名: `com.puito.cryptoagent.debug`

            ### 本构建包含
            - 全周期信号通知 + 周期胜率
            - AI 评估（可只通知不实盘）
            - 信号通知震动（设置可关，默认开）
            - HiBT 下单页 / 本地策略 / 图表指标

            包名固定 `com.puito.cryptoagent`，可直接覆盖安装，保留本地配置（需同一签名/debug 包）。
            勿再卸载除非要清空数据。
          files: android/dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Android APK 发布成功"
            echo "- https://github.com/${{ github.repository }}/releases/tag/android-app-latest"
            echo "- version ${{ steps.ver.outputs.name }} / ${{ steps.ver.outputs.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
