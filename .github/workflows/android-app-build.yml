name: Build Android App APK

on:
  push:
    branches: [android-app]
    paths:
      - "android/**"
      - ".github/workflows/android-app-build.yml"
      - "docs/Android界面设计.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bump versionCode
        id: ver
        working-directory: android
        run: |
          CODE="${{ github.run_number }}"
          NAME="0.2.${CODE}"
          SHA="${GITHUB_SHA:0:7}"
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          sed -i "s/versionCode = [0-9]*/versionCode = $CODE/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"$NAME\"/" app/build.gradle.kts
          grep version app/build.gradle.kts

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle wrapper --gradle-version 8.7
            ./gradlew assembleDebug --stacktrace
          fi
          mkdir -p dist
          SRC=$(find app/build/outputs/apk -name "*.apk" | head -1)
          cp "$SRC" "dist/app-debug.apk"
          cp "$SRC" "dist/crypto-agent-app-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.sha }}.apk"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-agent-app-${{ steps.ver.outputs.name }}
          path: android/dist/*.apk
          retention-days: 30

      - name: Recreate android-app-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-app-latest --repo "${{ github.repository }}" --yes 2>/dev/null || true
          git push origin :refs/tags/android-app-latest 2>/dev/null || true

      - name: Publish APK Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app-latest
          name: "Android App ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.sha }})"
          prerelease: true
          body: |
            ## Crypto-Agent Android 客户端（分支 android-app）
            - versionName: `${{ steps.ver.outputs.name }}`
            - versionCode: `${{ steps.ver.outputs.code }}`
            - commit: `${{ github.sha }}`
            - 包名: `com.puito.cryptoagent.debug`
            - 界面说明: `docs/Android界面设计.md`
            - Mobile API: `/api/v1/mobile/*`

            建议卸载旧包后安装。UI：币种/周期 Header、坐标轴图表缩放、配置 OR 规则、全部模拟统计。
          files: android/dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Android APK"
            echo "- https://github.com/${{ github.repository }}/releases/tag/android-app-latest"
            echo "- version ${{ steps.ver.outputs.name }}"
          } >> "$GITHUB_STEP_SUMMARY"
