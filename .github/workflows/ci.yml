name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
      - name: Import smoke
        env:
          PYTHONPATH: libs
        run: |
          python -c "from common.persist import ensure_persist_tree; ensure_persist_tree(); print('persist ok')"
          python -c "from common.logging import setup_logging; print('logging ok')"
      - name: Syntax check services
        env:
          PYTHONPATH: libs
        run: |
          python -m compileall -q services/libs 2>/dev/null || true
          python -m compileall -q services libs
