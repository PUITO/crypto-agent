name: Deploy Production

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "未配置 DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY，跳过真实部署（这是预期行为，直到你配置生产 Secrets）。"
            echo "### 部署已跳过" >> $GITHUB_STEP_SUMMARY
            echo "请在仓库 Settings → Secrets 中配置 DEPLOY_* 后再运行。" >> $GITHUB_STEP_SUMMARY
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Deploy over SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then DEPLOY_PATH=/opt/crypto-agent; fi
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_PATH"
            fi
            cd "$DEPLOY_PATH"
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            if [ ! -d .venv ]; then python3 -m venv .venv; fi
            .venv/bin/pip install -q -r requirements.txt
            if [ -n "${{ secrets.GITHUB_SYNC_REPO }}" ]; then
              touch .env
              grep -q GITHUB_SYNC_REPO .env 2>/dev/null || echo "GITHUB_SYNC_REPO=${{ secrets.GITHUB_SYNC_REPO }}" >> .env
            fi
            chmod +x scripts/*.sh scripts/lib/*.sh || true
            ./scripts/stop_all.sh || true
            export PATH="$DEPLOY_PATH/.venv/bin:$PATH"
            ./scripts/start_prod.sh
            ./scripts/status.sh || true
            echo "PUBLIC_BASE_URL=${{ secrets.PUBLIC_BASE_URL }}"

      - name: Print access URL
        if: steps.check.outputs.configured == 'true'
        run: |
          echo "### 公网访问" >> $GITHUB_STEP_SUMMARY
          echo "- API/Gateway: ${{ secrets.PUBLIC_BASE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docs: ${{ secrets.PUBLIC_BASE_URL }}/docs" >> $GITHUB_STEP_SUMMARY
          echo "- Health: ${{ secrets.PUBLIC_BASE_URL }}/api/v1/health/all" >> $GITHUB_STEP_SUMMARY

      - name: Skip notice
        if: steps.check.outputs.configured != 'true'
        run: echo "Deploy skipped — no production SSH secrets."
