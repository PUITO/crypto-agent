name: Deploy Frontend (GitHub Pages)

on:
  push:
    branches: [master, main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      gateway_url:
        description: "公网 Gateway 地址（如 https://api.example.com，勿尾斜杠）"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Resolve Gateway URL & base
        id: conf
        run: |
          GW="${{ github.event.inputs.gateway_url }}"
          if [ -z "$GW" ]; then GW="${{ secrets.PUBLIC_BASE_URL }}"; fi
          if [ -z "$GW" ]; then GW=""; fi
          echo "gateway=$GW" >> $GITHUB_OUTPUT
          # 项目页 base path
          echo "base=/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT
          echo "Frontend will use VITE_GATEWAY_URL=$GW"
          echo "VITE_BASE=/${{ github.event.repository.name }}/"

      - name: Install & build
        working-directory: frontend
        env:
          VITE_BASE: ${{ steps.conf.outputs.base }}
          VITE_GATEWAY_URL: ${{ steps.conf.outputs.gateway }}
        run: |
          npm install
          npm run build
          # 附带演示页
          cp public-demo.html dist/ 2>/dev/null || true
          # 无 gateway 时写提示页
          if [ -z "$VITE_GATEWAY_URL" ]; then
            cat > dist/API_NOTICE.txt << 'TXT'
本前端已部署到 GitHub Pages。
请配置仓库 Secret PUBLIC_BASE_URL 为你的 Gateway 公网地址，或手动 workflow_dispatch 传入 gateway_url。
TXT
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Access links
        run: |
          PAGE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          GW="${{ steps.conf.outputs.gateway }}"
          echo "### 前端主入口" >> $GITHUB_STEP_SUMMARY
          echo "- **用户端主入口:** $PAGE" >> $GITHUB_STEP_SUMMARY
          echo "- Demo: ${PAGE}public-demo.html" >> $GITHUB_STEP_SUMMARY
          if [ -n "$GW" ]; then
            echo "- **API Gateway:** $GW" >> $GITHUB_STEP_SUMMARY
            echo "- API Docs: $GW/docs" >> $GITHUB_STEP_SUMMARY
            echo "- Health: $GW/api/v1/health/all" >> $GITHUB_STEP_SUMMARY
          else
            echo "- API Gateway: （未配置 PUBLIC_BASE_URL / gateway_url，前端需在同源或稍后配置）" >> $GITHUB_STEP_SUMMARY
          fi
          echo "PAGE_URL=$PAGE" >> $GITHUB_ENV
          echo "Frontend: $PAGE"
