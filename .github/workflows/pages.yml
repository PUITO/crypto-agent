name: Deploy Frontend (GitHub Pages)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE: /crypto-agent/
          VITE_GATEWAY_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          npm install
          npm run build
          cp -f public-demo.html dist/public-demo.html || true
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print frontend URL
        run: |
          echo "### Frontend entry" >> $GITHUB_STEP_SUMMARY
          echo "https://puito.github.io/crypto-agent/" >> $GITHUB_STEP_SUMMARY
          echo "Demo: https://puito.github.io/crypto-agent/public-demo.html" >> $GITHUB_STEP_SUMMARY
